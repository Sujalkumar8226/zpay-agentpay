version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: zpay-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zpaypassword
      POSTGRES_DB: zpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zpay-backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:zpaypassword@db:5432/zpay
      - JWT_SECRET_KEY=zpay_super_secret_jwt_key_for_hackathon_2026
      - MASTER_ENCRYPTION_KEY=enBheV9hZ2VudF93YWxsZXRfbWFzdGVyX2tleV8zMmI=
      - STELLAR_NETWORK=testnet
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: zpay-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
